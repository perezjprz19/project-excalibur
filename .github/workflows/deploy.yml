name: Deploy to GitHub Pages

on:
  push:
    branches:
      - distribution  # or the default branch name (master, main, etc.)

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '23.11.0'  # You can specify your preferred Node.js version

      # Install dependencies
      - name: Install dependencies
        run: npm install

      # Build the project
      - name: Build project
        run: npm run build

      # Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages  # The branch where the built project will be deployed
          folder: build     # The folder to deploy, usually 'build' for React apps
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
